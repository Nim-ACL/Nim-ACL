name: v0.5.3 pinned hosted validation

on:
  push:
    branches:
      - ci/v053-pinned-hosted-validation-20261122

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }} / fixed RC
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        nim: ['2.2.4', '2.2.10']
    env:
      NACL_RC_SHA: 9c4232dd8f91df8e694fadb16c066e8c11d2b96a
      NACL_RC_NIM: ${{ matrix.nim }}
      NACL_RC_OS: ${{ runner.os }}
      NACL_RC_REPORT: ${{ runner.temp }}/nacl-v053-pinned-report
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9c4232dd8f91df8e694fadb16c066e8c11d2b96a
          persist-credentials: false
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          parent-nim-install-directory: ${{ runner.temp }}
          nim-install-directory: nacl-v053-nim-${{ matrix.nim }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare native Windows C++ tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command g++ -ErrorAction SilentlyContinue)) {
            foreach ($bin in @('C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin')) {
              if (Test-Path "$bin\g++.exe") {
                $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
          }
      - name: Install documentation and template dependencies
        run: python -m pip install -r tools/requirements.txt 'setuptools<81'
      - name: Record exact checkout and external toolchain
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, platform, shutil, subprocess
          expected = os.environ['NACL_RC_SHA']
          root = Path.cwd().resolve()
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit('CHECKOUT_SHA_MISMATCH')
          nim = Path(shutil.which('nim') or '').resolve()
          if not nim.is_file() or nim.is_relative_to(root):
              raise SystemExit('NIM_MUST_EXIST_OUTSIDE_CHECKOUT')
          version = subprocess.check_output([str(nim), '--version'], text=True)
          cxx = subprocess.check_output(['g++', '--version'], text=True)
          identity = {
              'sha': actual, 'nim': str(nim), 'nim_version_output': version,
              'cxx_version_output': cxx, 'os': platform.platform(),
              'requested_nim': os.environ['NACL_RC_NIM'],
              'runner_os': os.environ['RUNNER_OS'],
              'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
              'qualification_script_sha256': hashlib.sha256((root/'tools/qualify_release_candidate.py').read_bytes()).hexdigest(),
          }
          report = Path(os.environ['NACL_RC_REPORT'])
          report.mkdir(parents=True, exist_ok=True)
          (report/'HOSTED_IDENTITY.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(identity, indent=2), flush=True)
      - name: Qualify unchanged exact RC
        run: python tools/qualify_release_candidate.py
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v053-pinned-${{ matrix.os }}-nim-${{ matrix.nim }}
          path: ${{ runner.temp }}/nacl-v053-pinned-report/
          if-no-files-found: error
          retention-days: 30
