name: v0.5.3 release candidate qualification

on:
  push:
    branches:
      - 'rc/v0.5.3-*'
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: 'Exact 40-character commit SHA to qualify'
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        nim: ['2.2.4', '2.2.10']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare native Windows C++ tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Get-Command g++ -ErrorAction SilentlyContinue)) {
            foreach ($bin in @('C:\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\msys64\mingw64\bin')) {
              if (Test-Path "$bin\g++.exe") {
                $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            }
          }
      - name: Install documentation and template dependencies
        run: python -m pip install -r tools/requirements.txt 'setuptools<81'
      - name: Qualify exact candidate without publication
        env:
          NACL_RC_SHA: ${{ inputs.candidate-sha || github.sha }}
          NACL_RC_NIM: ${{ matrix.nim }}
          NACL_RC_OS: ${{ runner.os }}
          NACL_RC_REPORT: ${{ runner.temp }}/nacl-v053-report
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/qualify_release_candidate.py
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v053-${{ matrix.os }}-nim-${{ matrix.nim }}
          path: ${{ runner.temp }}/nacl-v053-report/
          if-no-files-found: error
          retention-days: 30
