name: M195 Nim-ACL portability pre-release

on:
  push:
    branches:
      - 'nacl/m195-platform-aee1b2bf'

permissions:
  contents: read

concurrency:
  group: m195-portability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            nim: '2.2.4'
          - os: ubuntu-24.04
            nim: '2.2.10'
          - os: windows-2025
            nim: '2.2.4'

    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run native-hosted portability checks
        env:
          M195_NIM_VERSION: ${{ matrix.nim }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/m195_portability_gate.py --report m195-ci-report

      - name: Save logs even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m195-${{ matrix.os }}-nim-${{ matrix.nim }}
          path: m195-ci-report/
          if-no-files-found: warn
          retention-days: 14
